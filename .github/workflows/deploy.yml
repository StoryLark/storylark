name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      migrate:
        description: 'Apply D1 migrations before deploy'
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        brand: [storylark]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w app -- --mode ${{ matrix.brand }}
      - name: Apply D1 migrations
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.migrate }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply ${{ matrix.brand }} --env ${{ matrix.brand }} --remote
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env ${{ matrix.brand }}

name: Sync release notes to storylark-org

# AB#7396 — Consolidate changelog ownership to one source of truth.
#
# packages/core/RELEASE-NOTES.md is the ONE curated, human-facing source of
# release notes (see the header comment in that file). Per-package
# CHANGELOG.md files stay Changesets-owned and mechanical — they are never
# touched here. storylark-org/src/docs/changelog.md is a GENERATED copy of
# RELEASE-NOTES.md and must never be hand-edited there; this workflow is the
# only thing that writes to it. Its content also drives the org site's
# version banner (build.mjs parses the first `## x.y.z` heading), so keeping
# it in lock-step with the engine's file keeps that banner honest too.
#
# This job pushes to a DIFFERENT repository (StoryLark/storylark-org), so the
# default GITHUB_TOKEN (scoped to this repo only) cannot be used. It mints a
# short-lived hcs-platform GitHub App installation token for storylark-org on
# every run. The App client id is stored as the
# HCS_PLATFORM_GITHUB_APP_CLIENT_ID repository variable and its private key as
# the HCS_PLATFORM_GITHUB_APP_PRIVATE_KEY repository secret; no personal token
# is stored or rotated here.

on:
  push:
    branches: [main]
    paths:
      - packages/core/RELEASE-NOTES.md
  workflow_dispatch: {}

concurrency: sync-release-notes-${{ github.ref }}

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout storylark (source of truth)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            packages/core/RELEASE-NOTES.md
          sparse-checkout-cone-mode: false
          path: storylark

      - name: Mint repository-scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.HCS_PLATFORM_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.HCS_PLATFORM_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: storylark-org
          permission-contents: write

      - name: Checkout storylark-org (generated copy)
        uses: actions/checkout@v4
        with:
          repository: StoryLark/storylark-org
          token: ${{ steps.app-token.outputs.token }}
          path: storylark-org

      - name: Copy RELEASE-NOTES.md over changelog.md
        run: cp storylark/packages/core/RELEASE-NOTES.md storylark-org/src/docs/changelog.md

      - name: Commit and push only if content changed
        working-directory: storylark-org
        run: |
          if git diff --quiet -- src/docs/changelog.md; then
            echo "No change — src/docs/changelog.md already matches RELEASE-NOTES.md."
            exit 0
          fi
          git config user.name "storylark-release-bot"
          git config user.email "actions@github.com"
          git add src/docs/changelog.md
          git commit -m "docs(changelog): sync from storylark packages/core/RELEASE-NOTES.md" \
            -m "Automated sync (AB#7396) — see storylark/.github/workflows/sync-release-notes.yml. Source commit: ${{ github.repository }}@${{ github.sha }}"
          git push origin HEAD:main

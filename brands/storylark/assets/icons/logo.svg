<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" font-family="Newsreader, Georgia, serif">
  <rect x="8" y="26" width="208" height="208" rx="48" fill="#0E7C7B"/>
  <g transform="translate(-52.640000000000015 3.4399999999999835) scale(0.56)"><circle cx="392" cy="150" r="46" fill="#E0A423"/>
  <g>
    <!-- far wing (behind), swept up-left -->
    <path d="M262 250 C 240 214 214 178 176 150 C 210 176 250 200 288 224 C 284 236 274 246 262 250 Z"
          fill="#FBF8F2" opacity="0.5"/>
    <!-- body + belly, compact, rising toward the head at upper-right -->
    <path d="M318 234 C 296 250 268 260 240 268 C 214 275 194 286 182 302
             C 210 300 240 296 266 290 C 296 283 316 262 322 238 Z" fill="#FBF8F2"/>
    <!-- fanned tail, notched, sweeping down-left -->
    <path d="M212 288 L 150 320 L 190 316 L 158 348 L 206 320 L 196 342 L 236 300 Z" fill="#FBF8F2"/>
    <!-- near wing (raised), broad and graceful -->
    <path d="M262 262 C 262 214 282 166 328 132 C 320 178 306 224 292 268
             C 282 266 271 264 262 262 Z" fill="#FBF8F2"/>
    <!-- head -->
    <circle cx="318" cy="204" r="31" fill="#FBF8F2"/>
    <!-- crest tuft (a lark's signature) -->
    <path d="M312 176 C 316 152 326 142 334 148 C 332 162 324 176 316 184 Z" fill="#FBF8F2"/>
    <!-- beak, upturned toward the sun -->
    <path d="M342 194 L 380 180 L 346 214 Z" fill="#E0A423"/>
  </g></g>
  <text x="262" y="150" font-size="118" fill="#232020" letter-spacing="1">Story<tspan fill="#0E7C7B">Lark</tspan></text>
  <text x="266" y="196" font-size="29" fill="#232020" opacity="0.72" font-style="italic">Read it. Hear it. Take it anywhere.</text>
</svg>